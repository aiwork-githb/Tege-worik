<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { ROOM, DOOR, WINDOW, RADIATOR, ITEMS, TRACKS, POWER } from './layout.js';

const state = { ready: false, errors: [], frames: 0, scene: 'day', view: 'overview' };
window.__room = state;
const failBox = document.getElementById('fail');
function fail(msg) {
  document.getElementById('fail-text').textContent = msg;
  failBox.hidden = false;
}
window.addEventListener('error', (e) => state.errors.push(String(e.message || e)));

// ---------------------------------------------------------------- базовое
const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  fail('Браузер не смог запустить WebGL. Откройте страницу в свежем Chrome, Safari или Firefox — или посмотрите план в масштабе (plan.svg).');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // карта теней пересчитывается, только пока светит солнце
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.03, 80);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.25;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.8;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

// единицы: план в сантиметрах → мир в метрах; y плана → −Z
const M = (v) => v / 100;
const V = (x, y, h) => new THREE.Vector3(M(x), M(h), -M(y));

function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shade(hex, k) {
  const c = new THREE.Color(hex);
  return `rgb(${Math.min(255, c.r * 255 * k) | 0},${Math.min(255, c.g * 255 * k) | 0},${Math.min(255, c.b * 255 * k) | 0})`;
}
function canvasTex(w, h, draw, { repeat = false, srgb = true } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

// ---------------------------------------------------------------- палитра и материалы
const COL = {
  wall: '#D6D0C7', wallB: '#4B4743', ceiling: '#F2EFEA', oak: '#C9A577', oakFloor: '#C8AE8C', graphite: '#2E2C2A',
  soft: '#9A938A', linen: '#E6E0D6', beige: '#CDBFAA', orange: '#C7652F', white: '#F4F2EE', enamel: '#E2DDD5',
  black: '#161514', warmLed: '#FFD9A8', neutralLed: '#FFF1DE',
};

const floorTex = canvasTex(1024, 1024, (g, S) => {
  const r = rng(11); const cols = 10; const pw = S / cols; const len = S * (122 / 180);
  for (let i = 0; i < cols; i++) {
    let y = -r() * len;
    while (y < S) {
      g.fillStyle = shade(COL.oakFloor, 0.93 + r() * 0.14);
      g.fillRect(i * pw, y, pw, len);
      g.strokeStyle = 'rgba(70,42,20,0.10)'; g.lineWidth = 1;
      for (let k = 0; k < 16; k++) {
        const gx = i * pw + r() * pw; const amp = 1 + r() * 3; g.beginPath(); g.moveTo(gx, y);
        for (let t = 0; t <= len; t += 12) g.lineTo(gx + Math.sin((t + k * 37) / 55) * amp, y + t);
        g.stroke();
      }
      g.fillStyle = 'rgba(55,35,18,0.35)'; g.fillRect(i * pw, y, pw, 2);
      y += len;
    }
    g.fillStyle = 'rgba(55,35,18,0.28)'; g.fillRect(i * pw, 0, 2, S);
  }
}, { repeat: true });
floorTex.repeat.set(ROOM.width / 180, ROOM.length / 180);

const veneerTex = canvasTex(512, 512, (g, S) => {
  const r = rng(5); g.fillStyle = COL.oak; g.fillRect(0, 0, S, S);
  for (let k = 0; k < 70; k++) {
    const y0 = r() * S; g.strokeStyle = `rgba(110,72,38,${0.05 + r() * 0.08})`; g.lineWidth = 0.6 + r() * 1.4;
    g.beginPath(); g.moveTo(0, y0);
    for (let x = 0; x <= S; x += 16) g.lineTo(x, y0 + Math.sin((x + k * 23) / 70) * (2 + r() * 4));
    g.stroke();
  }
}, { repeat: true });

const fabricTex = canvasTex(256, 256, (g, S) => {
  const r = rng(3); const img = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    const v = 226 + r() * 29 - ((i % S) % 4 === 0 ? 8 : 0);
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}, { repeat: true });
fabricTex.repeat.set(3, 3);

const perfMap = canvasTex(64, 64, (g) => { g.fillStyle = '#2B2927'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#58524C'; g.fillRect(16, 16, 32, 32); }, { repeat: true });
const perfGlow = canvasTex(64, 64, (g) => { g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#fff'; g.fillRect(16, 16, 32, 32); }, { repeat: true, srgb: false });
const pegMap = canvasTex(64, 64, (g) => {
  g.fillStyle = '#34312E'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#151413';
  g.beginPath(); g.arc(32, 32, 9, 0, Math.PI * 2); g.fill();
}, { repeat: true });
pegMap.repeat.set(120 / 2.5, 60 / 2.5);
const grilleTex = canvasTex(64, 16, (g) => { g.fillStyle = '#9C7A55'; g.fillRect(0, 0, 64, 16); g.fillStyle = '#1C1A18'; for (let x = 4; x < 64; x += 8) g.fillRect(x, 2, 4, 12); }, { repeat: true });
grilleTex.repeat.set(110 / 8, 1);

const rugTex = canvasTex(640, 920, (g, w, h) => {
  const r = rng(9); const s = 4; // 4 px = 1 см
  g.fillStyle = '#B9B2A8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${r() > 0.5 ? '255,255,255' : '60,55,50'},0.05)`; g.fillRect(r() * w, r() * h, 2, 2); }
  g.strokeStyle = '#EEEAE3'; g.lineWidth = 2.2 * s;
  g.strokeRect(8 * s, 8 * s, w - 16 * s, h - 16 * s);
  g.beginPath(); g.moveTo(8 * s, h / 2); g.lineTo(w - 8 * s, h / 2); g.stroke();
  g.beginPath(); g.arc(w / 2, h / 2, 25 * s, 0, Math.PI * 2); g.stroke();
  g.strokeRect(w / 2 - 25 * s, 8 * s, 50 * s, 70 * s);
  g.beginPath(); g.arc(w / 2, 78 * s, 25 * s, 0, Math.PI); g.stroke();
  g.beginPath(); g.arc(w / 2, 20 * s, 62 * s, 0.12 * Math.PI, 0.88 * Math.PI); g.stroke();
});

const blindTex = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#D9D2C7'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) {
    const grd = g.createLinearGradient(0, y, 0, y + 32);
    grd.addColorStop(0, 'rgba(255,255,255,0.18)'); grd.addColorStop(0.8, 'rgba(0,0,0,0.04)'); grd.addColorStop(1, 'rgba(0,0,0,0.16)');
    g.fillStyle = grd; g.fillRect(0, y, w, 32);
  }
}, { repeat: true });
blindTex.repeat.set(2, 5);

const cinemaTex = canvasTex(1280, 720, (g, w, h) => {
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#0E1116'); bg.addColorStop(0.55, '#1A1F27'); bg.addColorStop(1, '#0B0C0E');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(255,236,200,${0.05 + (i % 3) * 0.03})`; g.beginPath(); g.arc(80 + i * 47, 70 + (i % 4) * 9, 26, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#B98C5C'; g.beginPath(); g.moveTo(140, 640); g.lineTo(1140, 640); g.lineTo(930, 300); g.lineTo(350, 300); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(140, 640); g.lineTo(1140, 640); g.lineTo(930, 300); g.lineTo(350, 300); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(640, 300); g.lineTo(640, 640); g.stroke();
  g.beginPath(); g.ellipse(640, 455, 70, 32, 0, 0, Math.PI * 2); g.stroke();
  g.strokeRect(850, 395, 160, 120);
  g.fillStyle = '#E8E2D8';
  [[520, 470], [600, 430], [700, 500], [780, 420], [880, 470], [430, 520]].forEach(([x, y], i) => {
    g.fillStyle = i % 2 ? '#E8E2D8' : '#3D4B5C'; g.fillRect(x - 9, y - 70, 18, 70); g.beginPath(); g.arc(x, y - 82, 11, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = 'rgba(10,10,12,0.82)'; g.fillRect(60, 40, 640, 64);
  g.fillStyle = '#F2EEE8'; g.font = '600 34px "JetBrains Mono", monospace';
  g.fillText('ДОМА 98 : 96 ГОСТИ', 80, 84); g.fillStyle = '#CFA877'; g.fillText('4Ч 02:14', 500, 84);
});
const monitorTex = canvasTex(640, 360, (g, w, h) => {
  g.fillStyle = '#15171B'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1F232A'; g.fillRect(0, 0, 150, h); g.fillRect(0, 0, w, 26);
  const r = rng(21); const cols = ['#CFA877', '#9AA7B5', '#E6E0D6', '#7F8A70', '#5C6470'];
  for (let y = 46; y < h - 10; y += 16) {
    let x = 170 + (r() * 3 | 0) * 18;
    const n = 2 + (r() * 4 | 0);
    for (let k = 0; k < n; k++) { const ww = 20 + r() * 70; g.fillStyle = cols[(r() * cols.length) | 0]; g.fillRect(x, y, ww, 7); x += ww + 10; }
  }
  for (let y = 46; y < h; y += 26) { g.fillStyle = '#2C313A'; g.fillRect(14, y, 120, 12); }
});
const laptopTex = canvasTex(320, 200, (g, w, h) => {
  g.fillStyle = '#F4F1EC'; g.fillRect(0, 0, w, h); g.fillStyle = '#2E2C2A'; g.font = '600 16px sans-serif'; g.fillText('Алгебра · §12', 18, 32);
  g.fillStyle = '#B9B2A8'; for (let y = 50; y < h - 12; y += 14) g.fillRect(18, y, 150 + ((y * 7) % 110), 5);
});
const daySky = canvasTex(1024, 512, (g, w, h) => {
  const s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, '#BFD3E3'); s.addColorStop(0.7, '#EEF1EE'); s.addColorStop(1, '#E4E2DA');
  g.fillStyle = s; g.fillRect(0, 0, w, h);
  g.fillStyle = '#CFC6B8'; g.fillRect(120, 150, 780, 362);
  g.fillStyle = '#A9B4BC'; for (let y = 175; y < 500; y += 52) for (let x = 150; x < 880; x += 62) g.fillRect(x, y, 34, 32);
  const r = rng(4); for (let i = 0; i < 18; i++) { g.fillStyle = shade('#6E7F5E', 0.8 + r() * 0.4); g.beginPath(); g.arc(r() * w, 360 + r() * 140, 60 + r() * 60, 0, Math.PI * 2); g.fill(); }

// Под столешницей — полки на всю глубину шкафа за двумя дверцами со стороны стола.
// Выше стола: отсек к сиденью открыт вбок, отсек к столу открыт в комнату.
// Со стороны сиденья низ закрыт глухой стенкой с мягкой спинкой до уровня столов.
function bookRow(g, r, along, a0, a1, h, maxH, d0, d1) {
  let a = a0 + r() * 3;
  while (a < a1 - 3) {
    if (r() < 0.1 && a1 - a > 22) {
      const bw = 18 + r() * 3;
      if (along === 'y') box(d0, d1, a, a + bw, h, h + Math.min(14, maxH), MAT.graphiteMatte, g);
      else box(a, a + bw, d0, d1, h, h + Math.min(14, maxH), MAT.graphiteMatte, g);
      a += bw + 1; continue;
    }
    const w = 2 + r() * 2.8, hb = Math.min(maxH - 3, 18 + r() * 12);
    if (a + w > a1) break;
    const mat = MAT.book[(r() * MAT.book.length) | 0];
    if (along === 'y') box(d0, d1, a, a + w, h, h + hb, mat, g);
    else box(a, a + w, d0, d1, h, h + hb, mat, g);
    a += w + 0.15;
    if (r() < 0.07) a += 8 + r() * 8;
  }
}

}
{
  const it = item('rug');
  const g = group(itemInfo('rug'));
  const rug = box(it.x0, it.x1, it.y0, it.y1, 0, 0.8, MAT.rug, g, { cast: false });

}
const trackLinMat = { 1: led(COL.neutralLed), 2: led(COL.neutralLed) };
const spotMat = led(COL.neutralLed);
{
  const g = group({ num: '№ 19', name: 'Магнитный трек в потолке', size: '2 линии по 3 м, 48 В', note: 'Линейные модули 3000 K + 2 поворотных спота' });
  ceilingItems.push(g);
  TRACKS.forEach((t, i) => {

}

// розетки и выключатели
for (const p of POWER) {

  const g = group({ num: p.id, name: p.type === 'switch' ? 'Выключатель' : `Розетки: ${p.count} шт.`, size: `высота ${p.h} см`, note: p.label });

// ---------------------------------------------------------------- объединение геометрии
// Неподвижные детали предмета с одним материалом склеиваются в одну сетку: сотни книг и полок
// превращаются в десяток вызовов отрисовки. Подсказки работают как раньше — по группе предмета.
function mergeStatic(root) {
  const buckets = new Map();
  for (const m of root.children) {
    if (!m.isMesh || m.isInstancedMesh || m.children.length) continue;
    const key = `${m.material.uuid}|${m.castShadow}|${m.receiveShadow}`;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(m);
  }
  for (const list of buckets.values()) {
    if (list.length < 2) continue;
    const geos = list.map((m) => { m.updateMatrix(); return m.geometry.clone().applyMatrix4(m.matrix); });
    const merged = new THREE.Mesh(mergeGeometries(geos, false), list[0].material);
    merged.castShadow = list[0].castShadow; merged.receiveShadow = list[0].receiveShadow;
    for (const m of list) { root.remove(m); m.geometry.dispose(); }
    geos.forEach((g) => g.dispose());
    root.add(merged);
  }
}
pickables.forEach(mergeStatic);

// ---------------------------------------------------------------- свет
const LIGHTS = {};
function addLight(key, light, base) {
  light.intensity = 0; scene.add(light);
  (LIGHTS[key] ||= []).push({ light, base });
  return light;
}
function rectLight(key, color, base, w, h, pos, face) {
  const l = new THREE.RectAreaLight(color, 0, w, h);
  l.position.copy(pos);
  if (face === 'down') l.rotation.x = -Math.PI / 2;
  if (face === 'up') l.rotation.x = Math.PI / 2;
  if (face === '+x') l.rotation.y = -Math.PI / 2;
  if (face === '-x') l.rotation.y = Math.PI / 2;
  return addLight(key, l, base);
}

const hemi = addLight('hemi', new THREE.HemisphereLight('#FFF6EA', '#8D7B66', 0), 1.6);
const sun = addLight('sun', new THREE.DirectionalLight('#FFE6C4', 0), 4.2);
sun.position.copy(V(150, 330, 0).add(new THREE.Vector3(-0.3, 0.42, -1).normalize().multiplyScalar(14)));
sun.target.position.copy(V(150, 330, 0)); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;

// Площадные источники (дорогие) — только там, где важна форма света: трек, кровать, полки, экран.
// Остальная подсветка — точечные источники с малым радиусом. Число источников постоянно.
rectLight('track1', '#FFE9CF', 40, 0.03, 0.8, V(120, 360, CEIL - 3.7), 'down');
rectLight('track2', '#FFE9CF', 40, 0.03, 2.3, V(250, 265, CEIL - 3.7), 'down');
function spot(key, base, color, from, to, angle) {
  const s = new THREE.SpotLight(color, 0, 6, angle, 0.55, 2);
  s.position.copy(from); s.target.position.copy(to); scene.add(s.target);
  return addLight(key, s, base);
}
spot('spots', 9, '#FFE9CF', V(120, 125, CEIL - 6), V(105, 55, 130), 0.42);
spot('spots', 9, '#FFE9CF', V(250, 410, CEIL - 6), V(362, 410, 150), 0.4);
spot('desk', 5, '#FFF3E4', V(38, 358, 103), V(40, 420, 75), 0.75);
function point(key, base, color, pos, dist) {
  const l = new THREE.PointLight(color, 0, dist, 2);
  l.position.copy(pos);
  return addLight(key, l, base);
}
point('sconce', 1.6, '#FFC98E', V(18, 308, 96), 3.2);
point('seatLamp', 1.4, '#FFC98E', V(232, L - 16, 92), 3);
point('bias', 0.5, '#FFF3E4', V(345, 405, 110), 0.9);
point('halo', 0.9, '#FFC98E', V(6, 237.5, 158), 1.6);
point('console', 0.6, '#FFC98E', V(335, 225, 8), 1.2);
point('soffit', 1.0, '#FFD9A8', V(182.5, 490, CEIL - 26), 2.2);
rectLight('shelf', '#FFD9A8', 7, 0.24, 1.25, V(16, 410, 119.5), 'down');
rectLight('bedGlow', '#FFC98E', 7, 1.6, 1.0, V(110, 215, 12.5), 'down');
rectLight('screen', '#DCE4F0', 1.6, 2.21, 1.25, V(361.5, 225.7, 152), '-x');

const SCENES = {
  day: {
    label: 'День', night: false, blind: 0, screenDown: 0,
    note: 'Утреннее солнце с востока, искусственный свет выключен. Окно открыто — штора поднята в короб.',
    v: { hemi: 1, sun: 1, laptop: 0.7 },
  },
  general: {
    label: 'Общий', night: true, blind: 1, screenDown: 0,
    note: 'Трек 3000 K: линейные модули и два спота на шкаф и перфопанель, лента в коробе над окном. Около 150 лк.',
    v: { hemi: 0.45, track1: 1, track2: 1, spots: 1, soffit: 0.6, wardrobe: 0.5, shelf: 0.3, halo: 0.3, seatGlow: 0.3 },
  },
  work: {
    label: 'Рабочий', night: true, blind: 1, screenDown: 0,
    note: 'Учёба: лампа 4000 K слева и подсветка полок — около 500 лк на столе. Игра: лайтбар и мягкая подсветка за мониторами.',
    v: { hemi: 0.22, track1: 0.45, track2: 0.45, spots: 0.35, desk: 1, shelf: 1, bar: 1, monitors: 1, bias: 0.6, laptop: 1, soffit: 0.25, wardrobe: 0.2 },
  },
  evening: {
    label: 'Вечерний', night: true, blind: 1, screenDown: 0,
    note: '2700 K: бра у кровати и у окна, контур изголовья, парящая кровать и сиденье, короб над окном. Трек выключен.',
    v: { hemi: 0.1, sconce: 1, seatLamp: 1, halo: 1, bedGlow: 1, console: 0.7, soffit: 0.7, shelf: 0.5, seatGlow: 0.9, wardrobe: 0.35, bias: 0.3 },
  },
  cinema: {
    label: 'Кино', night: true, blind: 1, screenDown: 1,
    note: 'Экран опущен, штора закрыта. Остаются подсветка кровати на 25 % и под медиатумбой — глаза не устают от контраста.',
    v: { hemi: 0.025, screen: 1, bedGlow: 0.25, console: 0.2 },
  },
};
const KEYS = [...new Set([...Object.keys(LIGHTS), ...Object.keys(EMISSIVE)])];
const cur = Object.fromEntries(KEYS.map((k) => [k, 0]));
let target = {};
const extras = { blind: 0, screenDown: 0, beam: 0 };
let extrasTarget = { blind: 0, screenDown: 0, beam: 0 };

function applyValues() {
  for (const k of KEYS) {
    const v = cur[k];
    // число источников не меняется — шейдеры не перекомпилируются при смене сценария
    (LIGHTS[k] || []).forEach(({ light, base }) => { light.intensity = base * v; });
    (EMISSIVE[k] || []).forEach(({ m, base }) => { m.emissiveIntensity = base * v; });
  }
  blindRoll.scale.y = 0.14 + 0.86 * extras.blind;
  screenRoll.scale.y = Math.max(0.001, extras.screenDown);
  // луч показываем только при взгляде снаружи — изнутри комнаты он засвечивает кадр
  const c = camera.position;
  const inside = c.x > 0 && c.x < M(W) && c.z < 0 && c.z > -M(L) && c.y < M(CEIL);
  beamMat.opacity = inside ? 0 : 0.05 * extras.beam;
}
function setScene(name, instant = false) {
  const s = SCENES[name];
  state.scene = name;
  target = Object.fromEntries(KEYS.map((k) => [k, s.v[k] ?? 0]));
  extrasTarget = { blind: s.blind, screenDown: s.screenDown, beam: s.screenDown };
  backdrop.material.map = s.night ? nightSky : daySky; backdrop.material.needsUpdate = true;
  renderer.toneMappingExposure = s.night ? 1.15 : 1.0;
  document.getElementById('scene-note').textContent = s.note;
  document.querySelectorAll('#scenes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scene === name)));
  if (instant || reduceMotion.matches) { Object.assign(cur, target); Object.assign(extras, extrasTarget); applyValues(); }
}

// ---------------------------------------------------------------- камеры
const VIEWS = {
  overview: { pos: V(600, -250, 520), at: V(175, 290, 40) },
  door: { pos: V(270, 12, 165), at: V(130, 420, 90) },
  bed: { pos: V(48, 225, 102), at: V(365, 225, 150) },
  window: { pos: V(182, 205, 190), at: V(182, 520, 80) },
  gaming: { pos: V(170, 300, 165), at: V(350, 455, 105) },
  top: { pos: V(182.5, 261.5, 1000), at: V(182.5, 262.5, 0) },
};
let camAnim = null;
function setView(name, instant = false) {
  const v = VIEWS[name];
  state.view = name;
  document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  if (instant || reduceMotion.matches) { camera.position.copy(v.pos); controls.target.copy(v.at); controls.update(); camAnim = null; return; }
  camAnim = { t0: performance.now(), dur: 900, p0: camera.position.clone(), a0: controls.target.clone(), p1: v.pos.clone(), a1: v.at.clone() };
}

// ---------------------------------------------------------------- вырез стен для обзора снаружи
const tmp = new THREE.Vector3();
function updateCutaway() {
  for (const w of WALLS) {
    const outside = tmp.copy(camera.position).sub(w.center).dot(w.normal) > 0;
    for (const m of w.meshes) m.material = outside ? MAT.hidden : m.userData.mat;
    for (const e of w.extras) e.visible = !outside;
  }
  const above = camera.position.y > M(CEIL) - 0.02;
  ceiling.material = above ? MAT.hidden : ceiling.userData.mat;
  const p = camera.position;
  const insidePlan = p.x > 0 && p.x < M(W) && p.z < 0 && p.z > -M(L);
  backdrop.visible = backdrop.visible && insidePlan && !above;
  const topDown = above && insidePlan;
  for (const g of ceilingItems) g.visible = !topDown;
}

// ---------------------------------------------------------------- подсказка
const tip = document.getElementById('tip');
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hoverPending = null; let downAt = null;
function pick(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    if (!h.object.visible || h.object.material === MAT.hidden) continue;
    let o = h.object;
    while (o && !o.userData.info) o = o.parent;
    if (o && isShown(o)) return o.userData.info;
  }
  return null;
}
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function showTip(info, x, y) {
  if (!info) { tip.hidden = true; return; }
  document.getElementById('tip-num').textContent = info.num || '';
  document.getElementById('tip-name').textContent = info.name;
  document.getElementById('tip-size').textContent = info.size || '';
  document.getElementById('tip-note').textContent = info.note || '';
  tip.hidden = false;
  const app = document.getElementById('app').getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = x - app.left + 14, ly = y - app.top + 14;
  if (lx + tw > app.width - 8) lx = x - app.left - tw - 14;
  if (ly + th > app.height - 8) ly = y - app.top - th - 14;
  tip.style.transform = `translate(${Math.max(8, lx)}px, ${Math.max(8, ly)}px)`;
}
canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && e.buttons === 0) hoverPending = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerleave', () => { tip.hidden = true; });
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; if (e.pointerType === 'mouse') tip.hidden = true; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved < 6 && e.pointerType !== 'mouse') showTip(pick(e.clientX, e.clientY), e.clientX, e.clientY);
});
controls.addEventListener('start', () => { camAnim = null; });

// ---------------------------------------------------------------- UI
document.getElementById('views').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
document.getElementById('scenes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setScene(b.dataset.scene); });
const doorBtn = document.getElementById('door-toggle');
doorBtn.addEventListener('click', () => {
  const open = doorBtn.getAttribute('aria-pressed') !== 'true';
  doorBtn.setAttribute('aria-pressed', String(open));
  doorBtn.textContent = open ? 'Закрыть' : 'Открыть';
  doorTarget = open ? -Math.PI / 2 : 0;
  if (reduceMotion.matches) doorPivot.rotation.y = doorTarget;
});

function themeBg() {
  const c = getComputedStyle(document.documentElement).getPropertyValue('--scene-bg').trim() || '#E4DED6';
  scene.background = new THREE.Color(c);
}
themeBg();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeBg);
new MutationObserver(themeBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 640 ? 58 : 45;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

// ---------------------------------------------------------------- цикл
setScene('day', true);
setView('overview', true);
renderer.compile(scene, camera);
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (camAnim) {
    const t = Math.min(1, (now - camAnim.t0) / camAnim.dur);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.a0, camAnim.a1, e);
    if (t >= 1) camAnim = null;
  }
  controls.update();
  if (camera.position.y < 0.12) camera.position.y = 0.12;
  const k = reduceMotion.matches ? 1 : 1 - Math.exp(-dt * 5);
  for (const key of KEYS) cur[key] += ((target[key] ?? 0) - cur[key]) * k;
  for (const key of Object.keys(extras)) extras[key] += (extrasTarget[key] - extras[key]) * k;
  doorPivot.rotation.y += (doorTarget - doorPivot.rotation.y) * k;
  applyValues();
  updateCutaway();
  if (cur.sun > 0.01) renderer.shadowMap.needsUpdate = true;
  if (hoverPending) { const [x, y] = hoverPending; hoverPending = null; showTip(pick(x, y), x, y); }
  renderer.render(scene, camera);
  state.frames++;
  state.calls = renderer.info.render.calls;
  if (!state.ready && state.frames > 2) state.ready = true;
});
</script>
