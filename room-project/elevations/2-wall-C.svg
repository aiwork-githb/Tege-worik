<text x="62" y="39" font-size="7" fill="#6E6862">Вид из комнаты: слева угол со стеной D, справа — со стеной B. Привязки — от левого угла до центра изделия, высоты — от чистого пола до центра. М 1:25 (A4).</text>
<text x="62" y="50" font-size="7" fill="#2E2C2A">На стене: розеток — 1, выключателей — 1, выводов под свет и технику — 3.</text>
